<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HelpHub - Charities List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>HelpHub</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="charities.html">Charities</a>
    <a href="charity_profile.html">Charity Profile</a>
  </nav>
</header>

<main>
  <h2>Explore Our Charities</h2>
  <div class="charities-list">
    <!-- Existing charity cards will be here -->
  </div>

  <section id="charity-data">
    <h2>Featured Charities from Charity Navigator</h2>
    <div id="charity-list"></div>
    <div id="error-message" style="color: red;"></div>
  </section>
</main>

<footer>
  <p>&copy; 2024 HelpHub. All rights reserved. | <a href="mailto:contact@helphub.org">Contact Us</a></p>
</footer>

<script>
  const apiKey = '2114'; 
  const charityListDiv = document.getElementById('charity-list');
  const errorMessageDiv = document.getElementById('error-message');

  async function fetchCharityData() {
    try {
      const response = await fetch(`https://api.charitynavigator.org/v2/Organizations?app_id=YOUR_APP_ID&app_key=${apiKey}`);
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      const data = await response.json();
      displayCharityData(data);
    } catch (error) {
      errorMessageDiv.textContent = 'Failed to fetch charity data. Please try again later.';
      console.error('Fetch error:', error);
    }
  }

  function displayCharityData(charities) {
    charityListDiv.innerHTML = ''; // Clear previous data
    charities.forEach(charity => {
      const charityCard = document.createElement('div');
      charityCard.className = 'charity-card';
      charityCard.innerHTML = `
        <h3>${charity.charityName}</h3>
        <p>Rating: ${charity.rating || 'N/A'}</p>
        <p>${charity.mission || 'No mission statement available.'}</p>
        <a href="${charity.websiteURL}" target="_blank">Visit Website</a>
      `;
      charityListDiv.appendChild(charityCard);
    });
  }

  // Fetch charity data when the page loads
  document.addEventListener('DOMContentLoaded', fetchCharityData);
</script>

</body>
</html>
